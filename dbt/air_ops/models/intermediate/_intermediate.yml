version: 2

models:
  - name: int_flights_clean

    columns:

      - name: flight_id
        data_tests:
          - not_null
          - unique

      - name: flight_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - COMPLETED
                  - CANCELLED
                  - DIVERTED

      - name: delay_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ON_TIME
                  - DELAYED
                  - SEVERELY_DELAYED
                  - CANCELLED
                  - DIVERTED

      - name: route
        data_tests:
          - not_null