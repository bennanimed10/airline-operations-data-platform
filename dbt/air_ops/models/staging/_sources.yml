version: 2

sources:
  - name: raw
    database: AIR_OPS
    schema: RAW

    tables:
      - name: flights
        identifier: FLIGHTS

        columns:
          - name: FlightDate
            quote: true
            data_tests:
              - not_null

          - name: Reporting_Airline
            quote: true
            data_tests:
              - not_null

          - name: Origin
            quote: true
            data_tests:
              - not_null

          - name: Dest
            quote: true
            data_tests:
              - not_null

          - name: Cancelled
            quote: true
            data_tests:
              - not_null

          - name: Diverted
            quote: true
            data_tests:
              - not_null

      - name: airports
        identifier: AIRPORTS
        description: FAA airport base data (APT_BASE.csv), one row per facility per FAA cycle.

        columns:
          - name: ARPT_ID
            description: FAA location identifier (primary airport identifier).
            data_tests:
              - not_null

          - name: ARPT_NAME
            data_tests:
              - not_null